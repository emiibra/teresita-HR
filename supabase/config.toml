# Teresita HR — Supabase local / deploy config
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "teresita-hr"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.send-worker-invite]
verify_jwt = true
